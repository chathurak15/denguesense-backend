services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: denguesense-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB:-denguesense}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Colombo
      PGTZ: Asia/Colombo
    ports:
      - "5433:5432"
    volumes:
      - denguesense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  denguesense:
    image: denguesense-api:latest
    build: .
    pull_policy: build
    container_name: denguesense-api
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: "5432"
      TZ: Asia/Colombo
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Colombo"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  denguesense_pgdata:

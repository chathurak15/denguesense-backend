spring.application.name=denguesense
server.port=8080

#-----------------------------------------------------------------------------------------------------------------
# LOG
#-----------------------------------------------------------------------------------------------------------------

logging.file.name=/opt/tomcat/logs/Denguesense-Backend.log
logging.logback.rollingpolicy.file-name-pattern=${logging.file.name}.%d{yyyy-MM-dd}.%i.gz
logging.logback.rollingpolicy.max-history=365
logging.logback.rollingpolicy.max-file-size=50MB
#logging.pattern.console=

spring.profiles.active=local

logging.level.org.apache.http=INFO
logging.level.httpclient.wire=INFO

# Backend Base URL for OAuth Callbacks
Denguesense.backend.base.url=http://localhost:8080

# Flyway (cluster tables). baseline-version=0 so V1 still runs on existing Hibernate-managed schemas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Inline hotspot cluster detection: 5+ HIGH_RISK reports within 500 m in 24 hours. Overridable per environment.
cluster.detection.radius-meters=500
cluster.detection.min-cluster-size=5
cluster.detection.window-hours=24

# Forecast pipeline
forecast.model-version=lstm-v1

# Weekly forecast scheduler. Runs after the prior week's case CSV import + weather fetch land.
# Set forecast.scheduler.cron=- to disable the job (e.g. local dev).
forecast.scheduler.cron=0 0 2 * * MON
forecast.scheduler.zone=Asia/Colombo

# Open-Meteo archive API (weekly weather for LSTM features)
open-meteo.base-url=https://archive-api.open-meteo.com
open-meteo.timeout.connect-ms=10000
open-meteo.timeout.read-ms=30000
open-meteo.buffer-days=5
open-meteo.inter-district-delay-ms=1200
